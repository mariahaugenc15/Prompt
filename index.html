<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ec" />
    <!-- iOS ignores the web manifest for "Add to Home Screen" behavior and
         needs these explicitly to launch full-screen with its own icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prompt" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Roboto+Slab:wght@700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Prompt — prompt your life</title>
    <meta name="description" content="A little push, every day. Send a prompt, get a prompt, and watch your calendar fill up." />

    <!-- Open Graph / link-preview card (iMessage, WhatsApp, Slack, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prompt" />
    <meta property="og:title" content="Prompt" />
    <meta property="og:description" content="prompt your life — a little push, every day." />
    <meta property="og:url" content="https://promptsocial-topaz.vercel.app/invite" />
    <meta property="og:image" content="https://promptsocial-topaz.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prompt" />
    <meta name="twitter:description" content="prompt your life — a little push, every day." />
    <meta name="twitter:image" content="https://promptsocial-topaz.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
