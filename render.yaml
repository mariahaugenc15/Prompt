services:
  - type: web
    name: prompt-api
    runtime: node
    plan: free
    buildCommand: npm install
    # Not `npm run server` — that runs tsx in --watch mode, a dev-only file
    # watcher with no place in a production container (extra overhead, and
    # one more thing that can go wrong before the app ever binds a port).
    # `npm start` runs the server once, plainly.
    startCommand: npm start
    # No persistent disk while running on a plan that can't attach one
    # (Render's free/Hobby tier — disks need a paid plan, "Pro" on this
    # account since there's no separate "Starter" tier available here).
    # Without it, every redeploy or restart wipes every account and upload —
    # fine for testing the app is actually live, not for real users. Once
    # upgraded, uncomment this block AND set DATA_DIR back to /var/data below
    # (or just let a Blueprint sync do both, if this service is ever
    # recreated from this file rather than managed by hand in the dashboard).
    # disk:
    #   name: prompt-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      # Deliberately omitted for now: leaving DATA_DIR unset makes the app
      # fall back to a directory inside its own (ephemeral) container
      # filesystem — see server/db.ts — which always exists and is always
      # writable, unlike /var/data without a disk mounted there. Add this
      # back with value /var/data once the disk above is uncommented.
      # - key: DATA_DIR
      #   value: /var/data
      - key: CORS_ORIGIN
        sync: false
      # Comma-separated usernames to grant admin access (the trust & safety
      # dashboard at /admin) — applied on every server start. See
      # server/db.ts and "Admin dashboard & trust & safety" in the README.
      - key: ADMIN_USERNAMES
        sync: false
      # Optional override only. mediaStore.ts normally derives this
      # server's own public URL from each request (needed to build absolute
      # URLs for uploaded photos/videos/avatars, since a relative "/media/x"
      # URL would resolve against the frontend's origin instead once the two
      # are on different hosts) — only set this if a CDN or custom domain
      # sits in front of this service and req.protocol/host wouldn't reflect
      # its real public address.
      - key: PUBLIC_SERVER_URL
        sync: false
      # The frontend's public URL — used to build the link inside a
      # password-reset email. Set to wherever the frontend is deployed.
      - key: FRONTEND_URL
        sync: false
      # SMTP credentials for real password-reset emails (any provider that
      # speaks SMTP: Resend, Mailgun, Postmark, etc.). Without these, reset
      # emails are just logged to this service's console — fine for testing,
      # not for real users. See server/emailer.ts.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
