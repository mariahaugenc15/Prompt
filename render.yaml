services:
  - type: web
    name: prompt-api
    runtime: node
    plan: pro
    buildCommand: npm install
    # Not `npm run server` — that runs tsx in --watch mode, a dev-only file
    # watcher with no place in a production container (extra overhead, and
    # one more thing that can go wrong before the app ever binds a port).
    # `npm start` runs the server once, plainly.
    startCommand: npm start
    # Pro (this account's paid tier) supports a persistent disk — this is
    # what makes accounts, prompts, comments, reports, and uploaded
    # photos/videos actually survive a restart, redeploy, or the free-tier
    # idle spin-down that used to wipe all of it. Both the SQLite database
    # (server/db.ts) and uploaded media (server/mediaStore.ts) live under
    # this same mount, so one disk covers everything at once.
    disk:
      name: prompt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: CORS_ORIGIN
        sync: false
      # Comma-separated usernames to grant admin access (the trust & safety
      # dashboard at /admin) — applied on every server start. See
      # server/db.ts and "Admin dashboard & trust & safety" in the README.
      - key: ADMIN_USERNAMES
        sync: false
      # Optional override only. mediaStore.ts normally derives this
      # server's own public URL from each request (needed to build absolute
      # URLs for uploaded photos/videos/avatars, since a relative "/media/x"
      # URL would resolve against the frontend's origin instead once the two
      # are on different hosts) — only set this if a CDN or custom domain
      # sits in front of this service and req.protocol/host wouldn't reflect
      # its real public address.
      - key: PUBLIC_SERVER_URL
        sync: false
      # The frontend's public URL — used to build the link inside a
      # password-reset email. Set to wherever the frontend is deployed.
      - key: FRONTEND_URL
        sync: false
      # SMTP credentials for real password-reset emails (any provider that
      # speaks SMTP: Resend, Mailgun, Postmark, etc.). Without these, reset
      # emails are just logged to this service's console — fine for testing,
      # not for real users. See server/emailer.ts.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
